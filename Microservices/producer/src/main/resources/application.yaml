server:
  port: 8084
spring:
  application:
    name: producer
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring:
          json:
            # sends "course" as the type id instead of org.bulna.producer.dto.Course
            type:
              mapping: course:org.bulna.producer.dto.Course