server:
  port: 8082
spring:
  application:
    name: consumer
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: telusko-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: org.bulna.consumer.dto
            # maps the producer's "course" type id to this module's Course class
            type:
              mapping: course:org.bulna.consumer.dto.Course